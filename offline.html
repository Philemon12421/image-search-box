<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3a47f0">
    <title>You’re offline · ImageSearch</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg: #f2f3f1; --ink: #15181a; --muted: #62696d; --accent: #3a47f0; --accent-ink: #fff; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #101214; --ink: #eceeef; --muted: #9aa1a6; --accent: #7c86ff; --accent-ink: #0d0f1a; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        main { max-width: 420px; }
        svg { color: var(--accent); margin-bottom: 20px; }
        h1 { font-size: clamp(28px, 6vw, 36px); line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 12px; }
        p { color: var(--muted); font-size: 17px; line-height: 1.5; margin-bottom: 24px; }
        button {
            min-height: 48px; padding: 0 28px; border: none; border-radius: 10px;
            background: var(--accent); color: var(--accent-ink);
            font: inherit; font-weight: 600; cursor: pointer;
        }
        button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/>
            <circle cx="12" cy="19.5" r="1" fill="currentColor"/>
            <path d="M3 3l18 18"/>
        </svg>
        <h1>You’re offline</h1>
        <p>This page isn’t saved on your device yet. Check your connection and try again. Pages you’ve already opened still work.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
