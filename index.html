<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Search Engine</title>
    <meta name="description" content="Search free, high-quality photos and open them in a full-size viewer.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="image.css">
</head>

<body>

    <header class="topbar">
        <a href="#" class="brand" aria-label="ImageSearch home">
            <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/>
                <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
            </svg>
            ImageSearch
        </a>
        <nav class="topbar-nav">
            <a href="index.html" aria-current="page">Image search</a>
            <a href="links.html">Link page</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Find the photo your project is missing.</h1>
        <p class="hero-description">
            Search by subject, mood, or colour. Click any photo to see it full size and credit the photographer.
        </p>

        <form id="search-form" role="search">
            <label for="search-box" class="visually-hidden">Search photos</label>
            <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
            </svg>
            <input
                type="search"
                id="search-box"
                placeholder="Try “foggy mountains” or “blue door”"
                autocomplete="off"
                required
            >
            <button type="submit">Search</button>
        </form>

        <div class="suggestions" aria-label="Popular searches">
            <span>Popular:</span>
            <button type="button" class="suggestion">Nature</button>
            <button type="button" class="suggestion">Technology</button>
            <button type="button" class="suggestion">Architecture</button>
            <button type="button" class="suggestion">Travel</button>
        </div>
    </section>

    <main class="main-content">
        <div class="results-heading">
            <h2 id="results-title">Popular right now</h2>
            <p class="results-caption" id="results-caption" aria-live="polite"></p>
        </div>

        <div id="search-result" aria-busy="false"></div>

        <p id="status" class="status" role="status" hidden></p>

        <button id="show-more-btn" type="button">Show more photos</button>
    </main>

    <footer>
        <p>Photos provided by <a href="https://unsplash.com/?utm_source=image_search&utm_medium=referral" target="_blank" rel="noopener noreferrer">Unsplash</a>.</p>
    </footer>

    <dialog id="lightbox" aria-label="Photo viewer">
        <button type="button" class="lb-close" id="lb-close" aria-label="Close viewer">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>

        <figure class="lb-figure">
            <img id="lb-image" alt="">
            <figcaption>
                <span>Photo by <a id="lb-author" target="_blank" rel="noopener noreferrer"></a></span>
                <a id="lb-source" class="lb-source" target="_blank" rel="noopener noreferrer">View on Unsplash</a>
            </figcaption>
        </figure>
    </dialog>

    <script src="image.js"></script>
</body>
</html>
